<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">弹跳小球</title>
  <desc id="desc">一个蓝色小球循环弹跳，落地时轻轻压扁，地面的阴影随之变化。</desc>
  <defs>
    <linearGradient id="ball" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#82b8ff"/><stop offset="1" stop-color="#315bea"/></linearGradient>
  </defs>
  <style>
    .lift { animation: bounce 1.5s infinite; }
    .body { animation: squash 1.5s infinite; }
    .shadow { transform-origin:320px 348px; animation: shadow 1.5s infinite; }
    @keyframes bounce {0%,100%{transform:translateY(0);animation-timing-function:cubic-bezier(.55,0,1,.5)}50%{transform:translateY(194px);animation-timing-function:cubic-bezier(0,.5,.45,1)}}
    @keyframes squash {0%,35%,65%,100%{transform:scale(1)}45%,55%{transform:scale(.9,1.1)}50%{transform:scale(1.22,.78)}}
    @keyframes shadow {0%,100%{transform:scale(.55);opacity:.12}50%{transform:scale(1);opacity:.3}}
    .paused * { animation-play-state:paused !important; }
    @media(prefers-reduced-motion:reduce){.lift,.body,.shadow{animation:none}}
  </style>
  <rect width="640" height="420" rx="28" fill="#f1f4fb"/>
  <path d="M100 349H540" stroke="#d5ddeb" stroke-width="2"/>
  <ellipse class="shadow" cx="320" cy="348" rx="54" ry="9" fill="#254389"/>
  <g class="lift"><g transform="translate(320 110)"><g class="body">
    <circle r="44" fill="url(#ball)"/>
    <ellipse cx="-13" cy="-17" rx="14" ry="9" transform="rotate(-35 -13 -17)" fill="white" opacity=".34"/>
    <circle cx="-12" cy="3" r="3" fill="#173b91"/><circle cx="12" cy="3" r="3" fill="#173b91"/>
    <path d="M-8 15Q0 22 8 15" fill="none" stroke="#173b91" stroke-width="3" stroke-linecap="round"/>
  </g></g></g>
</svg>
