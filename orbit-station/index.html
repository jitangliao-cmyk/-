<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>轨道能量站 · SVG Motion</title>
<style>
:root{color-scheme:dark;--accent:#7dfbd6;--second:#9b8cff}*{box-sizing:border-box}body{margin:0;background:#090e1c;color:#eaf1ff;font-family:system-ui,-apple-system,sans-serif}main{max-width:1120px;margin:auto;padding:36px 28px}.top,.controls{display:flex;align-items:center;justify-content:space-between;gap:20px}.tag{font-size:11px;letter-spacing:3px;color:var(--accent)}h1{font-size:clamp(28px,5vw,48px);font-weight:500;letter-spacing:2px;margin:12px 0}p{color:#8291aa;font-size:14px;line-height:1.8}.badge{border:1px solid #283447;padding:9px 14px;border-radius:24px;color:var(--accent);font-size:11px;white-space:nowrap}.stage{position:relative;border:1px solid #263248;border-radius:24px;overflow:hidden;background:radial-gradient(ellipse at center,#172340,#090e1c 70%);margin:26px 0}svg{display:block;width:100%;height:auto}.controls{flex-wrap:wrap;background:#11192a;padding:18px 22px;border-radius:16px}button,select{font:inherit;border:1px solid #35425a;border-radius:10px;background:#172339;color:#eaf1ff;padding:10px 15px;cursor:pointer}button.primary{background:var(--accent);color:#071522;border:0;min-width:110px}label{display:flex;align-items:center;gap:10px;font-size:13px;color:#b2bfd3}button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}footer{font-size:12px;line-height:1.8;color:#7e8ca6;margin:24px 0}a{color:#a9b9df}.stats{display:flex;gap:30px;font-size:11px;color:#8799b5;letter-spacing:1px;margin-top:20px}.stats b{display:block;color:#d9e4f5;font-size:17px;margin-top:6px;font-weight:400}@media(max-width:600px){main{padding:24px 16px}.top{align-items:flex-start}.badge{display:none}.controls{gap:14px}.stats{gap:20px}}
</style>
<main><div class="top"><div><div class="tag">MOTION STUDY / 002</div><h1>轨道能量站</h1><p>一个核心，三重轨道。每一次脉冲，驱动新的旅程。</p></div><div class="badge">● SYSTEM ONLINE</div></div>

</defs>
<rect width="1000" height="660" fill="url(#grid)"/>
<g fill="#b5c9ed" id="stars"></g>
<text x="35" y="42" fill="#6c829e" font-size="11" letter-spacing="3">SECTOR 07 / ORBITAL LAB</text>
<path d="M35 70V55H50M950 55H965V70M35 590V605H50M950 605H965V590" stroke="#4c6a8a" fill="none"/>
<g transform="translate(500 330)">
 <circle r="260" fill="url(#halo)"/>
 <g fill="none" stroke="var(--accent)" stroke-width="1"><circle r="70" opacity=".3"><animate attributeName="r" values="70;270" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".35;0" dur="5s" repeatCount="indefinite"/></circle><circle r="70" opacity="0"><animate attributeName="r" values="70;270" begin="2.5s" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".35;0" begin="2.5s" dur="5s" repeatCount="indefinite"/></circle></g>
 <g opacity=".6"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/><path d="M0 0L0-260A260 260 0 0 1 130-225Z" fill="url(#beam)"/></g>
 <g fill="none" stroke="#527095"><circle r="125" opacity=".5"/><circle r="190" opacity=".4"/><circle r="260" opacity=".3"/><circle r="280" opacity=".15" stroke-dasharray="2 12"/></g>
 <g fill="none" stroke="var(--accent)"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="32s" repeatCount="indefinite"/><circle r="92" stroke-dasharray="120 30 5 30" stroke-width="2" opacity=".6"/><path d="M-290 0H-275M275 0H290M0-290V-275M0 275V290" opacity=".7"/></g>
 <g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="24s" repeatCount="indefinite"/><circle r="116" fill="none" stroke="var(--second)" stroke-dasharray="4 35" stroke-width="3" opacity=".65"/></g>
 <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/><circle cx="125" r="13" fill="var(--accent)" opacity=".3" filter="url(#glow)"/><circle cx="125" r="6" fill="var(--accent)"/><path d="M125-15V-7M125 7V15M110 0H118M132 0H140" stroke="var(--accent)"/></g>
 <g><animateTransform attributeName="transform" type="rotate" from="120" to="-240" dur="17s" repeatCount="indefinite"/><use href="#sat" x="190"/></g>
 <g><animateTransform attributeName="transform" type="rotate" from="230" to="590" dur="28s" repeatCount="indefinite"/><g transform="translate(260)"><path d="M-10-15L13 0L-10 15L-4 0Z" fill="var(--second)"/><path d="M-14 0H-37" stroke="var(--second)" stroke-width="3" opacity=".6"><animate attributeName="stroke-opacity" values=".2;.9;.2" dur=".6s" repeatCount="indefinite"/></path></g></g>
 <circle r="62" fill="var(--accent)" opacity=".2" filter="url(#glow)"><animate attributeName="r" values="56;67;56" dur="3s" repeatCount="indefinite"/></circle>

</g>

<div class="controls"><button class="primary" id="play" aria-pressed="false">暂停动画</button><label>运行速度<select id="speed"><option value="0.5">0.5× 舒缓</option><option value="1" selected>1× 标准</option><option value="2">2× 加速</option></select></label><label>能量配色<select id="theme"><option value="mint">薄荷极光</option><option value="sunset">日落橙紫</option><option value="ice">冰蓝星云</option></select></label></div>

</main>
<script>
const svg=document.getElementById('scene'),play=document.getElementById('play'),speed=document.getElementById('speed'),theme=document.getElementById('theme');
const ns='http://www.w3.org/2000/svg';
for(let i=0;i<65;i++){const c=document.createElementNS(ns,'circle');c.setAttribute('cx',String((i*173+31)%980+10));c.setAttribute('cy',String((i*97+23)%610+25));c.setAttribute('r',i%3===0?'1.5':'.8');c.setAttribute('opacity',String(.15+(i%5)*.12));if(i%4===0){const a=document.createElementNS(ns,'animate');a.setAttribute('attributeName','opacity');a.setAttribute('values','.15;.8;.15');a.setAttribute('dur',String(2+i%5)+'s');a.setAttribute('repeatCount','indefinite');c.append(a)}document.getElementById('stars').append(c)}
// pulseMarkup is inserted from the original Sam Herbert SVG during packaging.
let paused=matchMedia('(prefers-reduced-motion: reduce)').matches,rate=1,last;
svg.pauseAnimations();
function update(){play.textContent=paused?'播放动画':'暂停动画';play.setAttribute('aria-pressed',String(paused));document.getElementById('status').textContent=(paused?'已暂停':'运行中')+' · '+rate+'×'}
play.onclick=()=>{paused=!paused;last=undefined;update()};speed.onchange=()=>{rate=Number(speed.value);update()};theme.onchange=()=>{const colors={mint:['#7dfbd6','#9b8cff'],sunset:['#ffba7d','#ed83c7'],ice:['#87ddff','#86a0ff']}[theme.value];document.documentElement.style.setProperty('--accent',colors[0]);document.documentElement.style.setProperty('--second',colors[1])};
function frame(now){if(last!==undefined&&!paused)svg.setCurrentTime(svg.getCurrentTime()+Math.min((now-last)/1000,.1)*rate);last=now;requestAnimationFrame(frame)}update();requestAnimationFrame(frame);
</script></html>
